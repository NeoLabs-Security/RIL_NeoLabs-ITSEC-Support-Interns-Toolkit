name: Build Week 01 IT Security Support Production Pack

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/week-01/**"
      - "docs/brand/**"
      - ".github/workflows/build-week-01-production-pack.yml"

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab==4.2.5
      - name: Load pinned NeoLabs publication renderer
        run: |
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/NeoLabs-Security/RIL_NeoLabs-SOC1-interns-toolkit-/d81a289a5f79dbfa83af244065cca2451f967f3a/scripts/build-weekly-publication.py" \
            --output /tmp/neolabs-build-weekly-publication.py
      - name: Build branded Week 1 PDFs
        run: |
          python /tmp/neolabs-build-weekly-publication.py \
            --source docs/week-01/operation-night-watch-launch-pack.md \
            --output publications/00_NeoLabs_ITSEC_Week_01_Launch_Pack.pdf \
            --track "IT SECURITY SUPPORT" --week "Week 01"
          python /tmp/neolabs-build-weekly-publication.py \
            --source docs/week-01/secure-support-foundations.md \
            --output publications/01_NeoLabs_ITSEC_Week_01_Secure_Support_Foundations.pdf \
            --track "IT SECURITY SUPPORT" --week "Week 01"
          test -s publications/00_NeoLabs_ITSEC_Week_01_Launch_Pack.pdf
          test -s publications/01_NeoLabs_ITSEC_Week_01_Secure_Support_Foundations.pdf
      - name: Commit publications
        run: |
          git config user.name "neolabs-publications-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications/00_NeoLabs_ITSEC_Week_01_Launch_Pack.pdf \
                  publications/01_NeoLabs_ITSEC_Week_01_Secure_Support_Foundations.pdf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build branded Week 01 Support production PDFs"
          git push
