name: Enable Week 1 isolated tunnel client

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-week1-isolated-tunnel.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add tunnel-aware connect flow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('tools/neolabs.py')
          text=p.read_text()
          if 'import shutil\n' not in text:
              text=text.replace('import re\n', 'import re\nimport shutil\nimport subprocess\n')
          pattern=r'def connect\(_:\s*argparse\.Namespace\) -> None:\n.*?\n\ndef status\('
          replacement='''def connect(_: argparse.Namespace) -> None:
    manifest = refresh(read_session())
    state = str(manifest.get("lab_state") or "LIVE")
    if state not in INTERACTIVE_STATES:
        print(f"NeoLabs state: {state}. No interactive Support endpoint is active right now.")
        print("Use the toolkit's safe local support exercises or return during the scheduled live window.")
        return
    resources = manifest["resources"]
    tunnel = resources.get("tunnel")
    if isinstance(tunnel, dict) and tunnel.get("transport") == "ssh-local-forward":
        ssh = shutil.which("ssh")
        if not ssh:
            fail("OpenSSH client is required for the NeoLabs isolated tunnel. Install the Windows/Linux/macOS OpenSSH client and run `neolabs connect` again.")
        host = str(tunnel.get("host") or "")
        username = str(tunnel.get("username") or "")
        remote_host = str(tunnel.get("remote_host") or "127.0.0.1")
        try:
            port = int(tunnel.get("port") or 22)
            local_port = int(tunnel.get("local_port") or 18080)
            remote_port = int(tunnel.get("remote_port"))
        except (TypeError, ValueError):
            fail("server returned an invalid tunnel manifest")
        if not host or not username or not (1 <= port <= 65535 and 1024 <= local_port <= 65535 and 1 <= remote_port <= 65535):
            fail("server returned an incomplete tunnel manifest")
        local_host = "127.0.0.1"
        print(f"✓ Assigned pod: {manifest['pod_id']}")
        print(f"✓ Opening isolated NeoLabs support tunnel on http://{local_host}:{local_port}")
        print("When SSH asks for a password, enter the SAME private NeoLabs Access Code you used for `neolabs login`.")
        print("Keep this terminal open while validating the learner service. Press Ctrl+C when the live support session is finished.")
        command = [
            ssh, '-o', 'ExitOnForwardFailure=yes', '-o', 'ServerAliveInterval=30', '-o', 'ServerAliveCountMax=3',
            '-o', 'StrictHostKeyChecking=accept-new', '-o', 'PreferredAuthentications=password', '-o', 'PubkeyAuthentication=no',
            '-N', '-L', f'{local_host}:{local_port}:{remote_host}:{remote_port}', '-p', str(port), f'{username}@{host}'
        ]
        try:
            subprocess.run(command, check=True)
        except KeyboardInterrupt:
            print("\\n✓ NeoLabs live tunnel closed.")
        except subprocess.CalledProcessError as exc:
            fail(f"NeoLabs SSH tunnel exited with status {exc.returncode}; verify your Access Code and run `neolabs status` before retrying")
        return
    endpoints = resources.get("endpoints", [])
    print(f"✓ {state} context refreshed for {manifest['pod_id']}.")
    print(f"✓ {len(endpoints) if isinstance(endpoints, list) else 0} authorised support endpoint(s).")
    print("The manifest is authoritative. Run `neolabs targets` before working on a live endpoint.")


def status('''
          new,n=re.subn(pattern,replacement,text,flags=re.S)
          if n != 1:
              raise SystemExit(f'expected one connect function, patched {n}')
          p.write_text(new)
          PY
          python -m py_compile tools/neolabs.py
          git config user.name "neolabs-toolkit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/neolabs.py
          git commit -m "Open assigned Support pod through isolated NeoLabs SSH tunnel"
          git push
