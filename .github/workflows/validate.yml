name: Validate IT Security Support Toolkit

on:
  pull_request:
  push:
    branches: [main, codex/foundation-toolkit]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate NeoLabs Python clients and installed command
        run: |
          python -m py_compile tools/neolabs.py tools/support_tickets.py
          python -m unittest tests/test_support_tickets.py -v
          python -m pip install --disable-pip-version-check --no-deps -e .
          neolabs --help >/dev/null
          neolabs pod --help >/dev/null
          python tools/support_tickets.py --help >/dev/null

      - name: Validate Bash syntax
        run: |
          bash -n scripts/collect-system-baseline.sh
          bash -n scripts/backup-restore-rehearsal.sh

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          foreach ($path in @('scripts/Collect-SystemBaseline.ps1', 'neolabs.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

      - name: Rehearse synthetic backup and restore
        run: |
          workspace=/tmp/neolabs-recovery-lab
          mkdir -p "$workspace"
          bash scripts/backup-restore-rehearsal.sh "$workspace"
          grep -F 'status=success' "$workspace/evidence/rehearsal-result.txt"
          test "$(find "$workspace/source" -type f | wc -l)" -eq "$(find "$workspace/restored" -type f | wc -l)"

      - name: Check scripts for prohibited destructive shortcuts
        run: |
          if grep -RInE 'rm[[:space:]]+-rf|Clear-EventLog|wevtutil[[:space:]]+cl|DisableRealtimeMonitoring|Set-MpPreference.*Disable|ufw[[:space:]]+disable|Set-NetFirewallProfile.*Enabled[[:space:]]+False' scripts; then
            echo 'A prohibited destructive or security-disabling command was found.' >&2
            exit 1
          fi

      - name: Check repository safety boundary
        run: |
          if grep -RInE --exclude-dir=.git 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' .; then
            echo 'Private key material must not be committed.' >&2
            exit 1
          fi
          if find . -type f \( -name '*.pem' -o -name '*.key' -o -name '*.pfx' -o -name '*.p12' \) -print | grep -q .; then
            echo 'Credential material is not allowed.' >&2
            exit 1
          fi
