name: Build Week 02 Learning Pack

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/week-02/ghost-login-learning-pack.md"
      - "docs/brand/**"
      - ".github/workflows/build-week-02-learning-pack.yml"

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab==4.2.5

      - name: Load pinned NeoLabs publication renderer
        run: |
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/NeoLabs-Security/RIL_NeoLabs-SOC1-interns-toolkit-/d81a289a5f79dbfa83af244065cca2451f967f3a/scripts/build-weekly-publication.py" \
            --output /tmp/neolabs-build-weekly-publication.py

      - name: Build NeoLabs Week 02 PDF
        run: |
          python /tmp/neolabs-build-weekly-publication.py \
            --source docs/week-02/ghost-login-learning-pack.md \
            --output publications/NeoLabs_ITSEC_Support_Week_02_Ghost_Login.pdf \
            --track "IT SECURITY SUPPORT" \
            --week "Week 02"

      - name: Commit generated publication
        run: |
          git config user.name "neolabs-publications-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications/NeoLabs_ITSEC_Support_Week_02_Ghost_Login.pdf
          if git diff --cached --quiet; then
            echo "Publication is already current."
            exit 0
          fi
          git commit -m "Build branded Week 02 Support learning pack"
          git push
